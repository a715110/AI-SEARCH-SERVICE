# =====================================================================
# ai-search-service - CLOUD profile (every customer instance)
# Activated with SPRING_PROFILES_ACTIVE=cloud. TLS ends at the ingress; the
# service speaks plain HTTP inside the instance network. No keystore here.
# =====================================================================

# Managed identity: reads Key Vault and Blob Storage.
spring.cloud.azure.credential.managed-identity-enabled=true
spring.cloud.azure.credential.client-id=${AZURE_CLIENT_ID:}
spring.cloud.azure.keyvault.secret.property-source-enabled=true
spring.cloud.azure.keyvault.secret.property-sources[0].name=dodaso-instance-kv
spring.cloud.azure.keyvault.secret.property-sources[0].endpoint=${AZURE_KEYVAULT_ENDPOINT}

# Eureka: register an address other services can reach, over plain HTTP.
eureka.client.tls.enabled=${EUREKA_TLS_ENABLED:false}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:false}
eureka.instance.non-secure-port-enabled=true
eureka.instance.non-secure-port=${server.port}
eureka.instance.secure-port-enabled=false
eureka.instance.status-page-url-path=/actuator/info
eureka.instance.health-check-url-path=/actuator/health
eureka.instance.home-page-url-path=/
