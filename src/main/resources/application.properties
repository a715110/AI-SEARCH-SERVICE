# =====================================================================
# ai-search-service - BASE configuration (all environments)
#
# Rules (SDS Step 1):
#   * Product defaults only. No hosts, local paths or secrets here.
#   * Instance values -> environment variables; secrets -> Key Vault secret names.
#   * Profiles: local = developer machine, cloud = every customer instance.
#
# STEP1 removals from the previous base file:
#   - spring.profiles.active=local (hard-coded; every build started as "local")
# =====================================================================

spring.application.name=ai_service
eureka.instance.appname=ai_service
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

dodaso.instance.customer-code=${DODASO_CUSTOMER_CODE}
dodaso.instance.display-name=${DODASO_CUSTOMER_NAME}
dodaso.instance.environment=${DODASO_ENVIRONMENT}
dodaso.instance.ecws-base-url=${DODASO_ECWS_BASE_URL}
dodaso.instance.elcm-base-url=${DODASO_ELCM_BASE_URL}
dodaso.instance.auth-issuer-uri=${DODASO_AUTH_ISSUER_URI}

# JPA (PostgreSQL + pgvector)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=com.dodaso.ecosystem.baseline.common.PhysicalNamingStrategyImpl
# STEP1: "update" lets Hibernate alter a customer's schema on startup. Deployed
# instances only validate; the schema must be created by a migration (open item).
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.enabled=false

# DataSource
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${AI_DB_HOST}:${AI_DB_PORT:5432}/${AI_DB_NAME:ecws_ai}?sslmode=verify-full
spring.datasource.username=${AI_DB_USER}
spring.datasource.password=${ai-db-password}
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.poolName=ai-service-hikariCP
spring.datasource.hikari.maximumPoolSize=10

# PGVector
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768

# Ollama (embeddings + local chat). Runs inside the customer instance, so
# document text never leaves it.
spring.ai.ollama.base-url=${OLLAMA_BASE_URL}
spring.ai.ollama.embedding.options.model=nomic-embed-text
spring.ai.ollama.chat.options.temperature=0.2
spring.ai.ollama.chat.options.model=phi3:3.8b

# OpenAI. INERT: spring-ai-starter-model-openai is commented out in the pom.
# Before enabling it, decide where customer text may be sent (see STEP1 notes).
spring.ai.openai.api-key=${ai-openai-api-key}
spring.ai.openai.chat.options.model=gpt-5-mini

# Eureka client (instance addressing is per profile)
eureka.client.service-url.defaultZone=${EUREKA_SERVICE_URL}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=5
eureka.client.initial-instance-info-replication-interval-seconds=5
eureka.client.healthcheck.enabled=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# Actuator: health (with liveness/readiness) and info only
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.build.enabled=true

# JWT. NOTE: ai-search used a DIFFERENT value from every other app. If it
# validates tokens issued elsewhere, it should use platform-jwt-secret instead.
auth.jwt.secret=${ai-jwt-secret}
auth.jwt.expiration=86400000

# Azure Blob (common-service code is on this classpath through ecws-service)
spring.cloud.azure.storage.blob.endpoint=${AZURE_STORAGE_BLOB_ENDPOINT}

# Logging: stdout only in deployed instances (file logging is local-only)
logging.pattern.level=%5p [${dodaso.instance.customer-code}]
logging.level.root=INFO
logging.level.com.dodaso.ecosystem.ai.advisor=INFO
