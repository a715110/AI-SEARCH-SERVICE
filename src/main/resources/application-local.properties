spring.application.name=AI-SEARCH-SERVICE
eureka.instance.appname=AI-SEARCH-SERVICE
server.servlet.context-path=/
server.port=8443

# Database Configuration (PostgreSQL)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=com.dodaso.ecosystem.baseline.common.PhysicalNamingStrategyImpl

# Add this line to auto-update schema from entities
spring.jpa.hibernate.ddl-auto=update

# DataSource
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:${AI_DB_PORT:5433}/${AI_DB_NAME:ecws_ai}
spring.datasource.username=${AI_DB_USER:ecws_user}
spring.datasource.password=${AI_DB_PASSWORD:ecws_ai_dev_password}
spring.datasource.type=com.zaxxer.hikari.HikariDataSource

# PGVector Configuration
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768

# Ollama Configuration (For Local Search/Embedding)
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.options.model=nomic-embed-text
spring.ai.ollama.chat.options.temperature=0.2
spring.ai.ollama.chat.options.model=phi3:3.8b

# OpenAI Configuration (For Summarization/Email)
spring.ai.openai.api-key=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
spring.ai.openai.chat.options.model=gpt-5-mini

# HikariCP Settings
spring.datasource.hikari.poolName=ai-service-hikariCP
spring.datasource.hikari.maximumPoolSize=10

# Jasypt
jasypt.encryptor.algorithm=PBEWithMD5AndDES
jasypt.encryptor.iv-generator-classname=org.jasypt.iv.NoIvGenerator

# Liquibase
spring.liquibase.enabled=false

server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:dodaso_keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-alias=dodaso-server


# Eureka Client configuration
#eureka.client.enabled=false
eureka.client.service-url.defaultZone=https://localhost:9443/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Eureka HTTPS configuration
eureka.instance.secure-port-enabled=true
eureka.instance.secure-port=443
eureka.instance.non-secure-port-enabled=false
eureka.instance.status-page-url=https://localhost:443/actuator/info
eureka.instance.health-check-url=https://localhost:443/actuator/health
eureka.instance.home-page-url=https://localhost:443/
eureka.client.registry-fetch-interval-seconds=5
# Enable initial registry fetch
eureka.client.initial-instance-info-replication-interval-seconds=5
# Health check configuration
eureka.client.healthcheck.enabled=true
# Instance configuration
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

eureka.client.tls.enabled=true
eureka.client.tls.trust-store=classpath:dodaso_truststore.p12
eureka.client.tls.trust-store-password=changeit
eureka.client.tls.trust-store-type=PKCS12

# JWT Security
auth.jwt.secret=70e99878105f88a07135da71b17a1546270e99878105f88a07135da71b17a1546
auth.jwt.expiration=86400000

# Logging Configuration
logging.level.com.dodaso.ecosystem.ai.advisor=INFO
logging.file.name=logs/ai-search-log
logging.file.path=logs
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

